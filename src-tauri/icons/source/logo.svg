<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f2915f"/>
      <stop offset="0.55" stop-color="#c85d9a"/>
      <stop offset="1" stop-color="#6d4fe8"/>
    </linearGradient>
    <!-- Cuts a gap into the planet where the front of the ring passes -->
    <mask id="gap">
      <rect width="1024" height="1024" fill="#fff"/>
      <path transform="translate(492 540) rotate(-20)" fill="none" stroke="#000" stroke-width="96"
            d="M-318 0 A318 86 0 0 0 318 0"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- A ringed planet: the back of the ring shows faintly behind it -->
  <path transform="translate(492 540) rotate(-20)" fill="none" stroke="#ffffff" stroke-opacity="0.32"
        stroke-width="44" stroke-linecap="round" d="M-318 0 A318 86 0 0 1 318 0"/>
  <circle cx="492" cy="540" r="178" fill="#ffffff" mask="url(#gap)"/>
  <path transform="translate(492 540) rotate(-20)" fill="none" stroke="#ffffff"
        stroke-width="44" stroke-linecap="round" d="M-318 0 A318 86 0 0 0 318 0"/>
  <!-- A small moon -->
  <circle cx="768" cy="262" r="46" fill="#ffffff" fill-opacity="0.9"/>
</svg>
